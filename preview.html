<!doctype html>
<!--
  Zero-install preview: runs the real files in src/ straight in the browser (Babel for JSX,
  esm.sh for React, the Tailwind browser build for CSS). For development, use `npm run dev`.
  Serve this folder with any static server, e.g. `python3 -m http.server 5178`, then open /preview.html.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiotechDaily (preview)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('bd-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.0",
          "react/": "https://esm.sh/react@19.1.0/",
          "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?deps=react@19.1.0"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const modules = new Map();

      async function injectCss(url) {
        const css = (await (await fetch(url)).text()).replace(/@import\s+["']tailwindcss["'];?/, '');
        const style = document.createElement('style');
        style.type = 'text/tailwindcss';
        style.textContent = css;
        document.head.appendChild(style);
        const tw = document.createElement('script');
        tw.src = 'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11';
        document.head.appendChild(tw);
      }

      // Transform a source file, recursively load its relative imports, return a blob: URL.
      function load(url) {
        if (!modules.has(url)) {
          modules.set(url, (async () => {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Failed to fetch ${url}`);
            let { code } = Babel.transform(await res.text(), {
              filename: url,
              sourceType: 'module',
              presets: [['react', { runtime: 'automatic' }]],
            });
            const specs = [...new Set([...code.matchAll(/(?:from|import)\s*["'](\.{1,2}\/[^"']+)["']/g)].map((m) => m[1]))];
            for (const spec of specs) {
              const abs = new URL(spec, url).href;
              let target;
              if (abs.endsWith('.css')) {
                await injectCss(abs);
                target = 'data:text/javascript,';
              } else {
                target = await load(abs);
              }
              code = code.split(`"${spec}"`).join(`"${target}"`).split(`'${spec}'`).join(`'${target}'`);
            }
            return URL.createObjectURL(new Blob([`${code}\n//# sourceURL=${url}`], { type: 'text/javascript' }));
          })());
        }
        return modules.get(url);
      }

      load(new URL('./src/main.jsx', location.href).href)
        .then((u) => import(u))
        .catch((e) => {
          document.getElementById('root').innerHTML = `<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap">${e.stack || e}</pre>`;
          console.error(e);
        });
    </script>
  </body>
</html>
